<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResoFinder - Search All Reservation Platforms</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🍽️ ResoFinder</h1>
      <p class="tagline">Search Resy, OpenTable, and Tock - All at Once</p>
    </header>

    <section class="search-section">
      <div class="search-card">
        <h2>Find Your Reservation</h2>

        <form id="searchForm">
          <div class="form-group">
            <label for="restaurant">Restaurant Name</label>
            <input
              type="text"
              id="restaurant"
              name="restaurant"
              required
              placeholder="e.g., Republique, Found Oyster, Bestia"
              autofocus
            >
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="date">Date</label>
              <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
              <label for="time">Time</label>
              <input type="time" id="time" name="time" required>
            </div>
          </div>

          <div class="form-group">
            <label for="partySize">Party Size</label>
            <select id="partySize" name="partySize" required>
              <option value="">Select size</option>
              <option value="1">1 person</option>
              <option value="2">2 people</option>
              <option value="3">3 people</option>
              <option value="4">4 people</option>
              <option value="5">5 people</option>
              <option value="6">6 people</option>
              <option value="7">7 people</option>
              <option value="8">8 people</option>
            </select>
          </div>

          <button type="submit" class="search-btn" id="searchBtn">
            <span class="btn-text">Search All Platforms</span>
            <span class="btn-loading" style="display: none;">Searching...</span>
          </button>
        </form>
      </div>
    </section>

    <section class="results-section" id="resultsSection" style="display: none;">
      <h2>Search Results</h2>

      <div class="results-grid" id="resultsGrid">
        <!-- Results will be inserted here -->
      </div>
    </section>

    <section class="how-it-works">
      <h2>How It Works</h2>
      <div class="steps">
        <div class="step">
          <div class="step-icon">🔍</div>
          <h3>Enter Details</h3>
          <p>Tell us where and when you want to dine</p>
        </div>
        <div class="step">
          <div class="step-icon">⚡</div>
          <h3>We Search</h3>
          <p>Our bot searches Resy & OpenTable in real-time</p>
        </div>
        <div class="step">
          <div class="step-icon">🎉</div>
          <h3>Click to Book</h3>
          <p>Get direct links to make your reservation</p>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
